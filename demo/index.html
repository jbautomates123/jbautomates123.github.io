ACT.syncNow = function () {
  if (!IS_GOOGLE) { toast('Demo mode: everything is saved in this browser only.'); return; }
  if (Sync.outbox.length) { flush(); toast('Trying to send ' + Sync.outbox.length + ' waiting ' + plural(Sync.outbox.length, 'change') + '...'); return; }
  reloadFromServer().then(function () { toast('Up to date'); }, function () { toast('Could not reach Google. Check your signal.'); });
};

/* Settings forms (plain forms on the Settings screen) */
var FORMS = {
  business: function (f) {
    var s = S();
    if (!fv(f, 'company')) { toast('Company name can\'t be empty.'); return; }
    // Version 3.4 fix: this number goes into every text to customers, so it gets the same check as other phone boxes.
    var bp = f.elements.namedItem('businessPhone'), bpMsg = phoneProblem(bp.value, false, bp);
    fieldNote(bp, bpMsg);
    if (bpMsg) { bp.focus(); return; }
    s.company = fv(f, 'company');
    s.businessPhone = fmtPhone(fv(f, 'businessPhone'));
    s.ownerName = fv(f, 'ownerName') || s.ownerName;
    s.callbackPromise = fv(f, 'callbackPromise') || s.callbackPromise;
    putMeta('settings');
    applyCompany();
    render();
    toast('Business info saved');
  },
  addCrew: function (f) {
    var n = fv(f, 'name');
    if (!n) return;
    if (S().crew.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) { toast(n + ' is already on the list'); return; }
    S().crew.push(n);
    putMeta('settings');
    render();
    toast(n + ' added to the crew');
    var inp = $('#newCrew'); if (inp) inp.focus();
  },
  addSource: function (f) {
    var n = fv(f, 'name');
    if (!n) return;
    if (S().sources.some(function (x) { return x.toLowerCase() === n.toLowerCase(); })) { toast('"' + n + '" is already on the list'); return; }
    S().sources.push(n);
    putMeta('settings');
    render();
    var inp = $('#newSource'); if (inp) inp.focus();
  },
  alerts: function (f) {
    // Version 3.4: the email address is required only when alerts are on
    var on = !!fv(f, 'alertOn'), em = f.elements.namedItem('alertEmail');
    var msg = on && !String(em.value).trim() ? 'Add the email address to send alerts to' : emailProblem(em.value);
    fieldNote(em, msg);
    if (msg) { em.focus(); return; }
    S().alertOn = on;
    S().alertEmail = String(em.value).trim();
    putMeta('settings');
    render();
    toast(on ? 'Alerts on. New leads will email ' + S().alertEmail : 'Alerts off');
  },
  rules: function (f) {
    S().callbackHours = Math.max(1, Math.min(168, Number(fv(f, 'callbackHours')) || 24));
    S().followUpDays = Math.max(1, Math.min(30, Number(fv(f, 'followUpDays')) || 3));
    putMeta('settings');
    render();
    toast('Reminders saved');
  }
};

/* =====================================================================
   START UP
   ===================================================================== */
function onClick(e) {
  var closeBtn = e.target.closest('[data-close]');
  if (closeBtn && closeBtn.closest('.sheet-wrap')) { e.preventDefault(); closeSheet(sheetOf(closeBtn)); return; }
  var key = e.target.closest('[data-key]');
  if (key) { pinKey(key.getAttribute('data-key')); return; }
  var t = e.target.closest('[data-act]');
  if (!t) return;
  var fn = ACT[t.getAttribute('data-act')];
  if (!fn) return;
  e.preventDefault();
  var q = t.hasAttribute('data-confirm') ? confirmFor(t) : null;
  if (q) { askConfirm(q, function (pop) { fn(t.dataset, t, e, pop); }); return; }
  fn(t.dataset, t, e);
}
function onKey(e) {
  if (!$('#lock').hidden) {
    if (/^\d$/.test(e.key)) { pinKey(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { pinKey('back'); e.preventDefault(); }
    return;
  }
  var top = topSheet();
  if (e.key === 'Escape' && top) { e.preventDefault(); closeSheet(top); return; }
  if (e.key === 'Tab' && top) {
    var f = $$('button, a[href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])', top.el).filter(function (x) {
      return !x.disabled && !x.hidden && x.offsetParent !== null;
    });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === $('.sheet', top.el))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
function onSubmit(e) {
  var f = e.target, name = f.getAttribute && f.getAttribute('data-form');
  if (!name || !FORMS[name]) return;
  e.preventDefault();
  FORMS[name](f);
}
function onInput(e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-input');
  if (k === 'custQuery') {
    UI.custQuery = t.value;
    var box = $('#custList'); if (box) box.innerHTML = str(custListHtml());
  } else if (k === 'me' && e.type === 'change') {
    DEVICE.me = t.value;
    saveDevice();
    toast(t.value ? 'This phone is set to ' + t.value : 'Name cleared');
  }
}
function enterApp() {
  $('#lock').hidden = true;
  $('#app').hidden = false;
  applyCompany();
  if (SESSION.firstRun) { SESSION.firstRun = false; putMeta('settings'); }
  if (!IS_GOOGLE) loadForecast();
  render();
  if (IS_GOOGLE) { loadForecast(); flush(); }
  if (!enterApp.started) {
    enterApp.started = true;
    startPolling();
    if (IS_GOOGLE) setInterval(loadForecast, 3 * 3600 * 1000);
    // Re-draw every few minutes so "waiting" times and the date stay current.
    setInterval(function () { if (SESSION.unlocked && !anyFormOpen()) refreshAll(); }, 5 * 60 * 1000);
  }
}
function boot() {
  paintIcons(document);
  applyTheme();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);
  window.addEventListener('online', function () { flush(); });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && IS_GOOGLE && SESSION.unlocked && !Sync.busy && !Sync.outbox.length && !anyFormOpen()) {
      gs('apiRev', SESSION.pin).then(function (rev) { if (Number(rev) > Sync.rev) return reloadFromServer(); }).catch(function () { /* offline */ });
    }
  });
  var h = String(location.hash || '').replace('#', '');
  if (VIEW_NAMES.indexOf(h) !== -1) UI.view = h;

  if (IS_GOOGLE) {
    if (DEVICE.pin) {
      showLock('Opening...');
      $('#lock').dataset.busy = '1';
      gs('apiLoad', DEVICE.pin).then(function (res) {
        $('#lock').dataset.busy = '';
        SESSION.pin = DEVICE.pin;
        SESSION.unlocked = true;
        applyServerData(res);
        SESSION.firstRun = !(res && res.data && res.data.settings);
        enterApp();
      }, function (err) {
        $('#lock').dataset.busy = '';
        if (isPinError(err)) { DEVICE.pin = ''; saveDevice(); showLock('The PIN was changed. Enter the new one.'); }
        else showLock('Could not reach Google. Check your signal, then enter your PIN.');
      });
    } else showLock();
    return;
  }

  var saved = lsGet(LS_DEMO);
  DB = saved ? normalize(saved) : null;
  // Untouched sample data is rebuilt each day so the demo always looks current.
  if (!DB || (DB.meta.sample && !DB.meta.touched && DB.meta.builtOn !== todayYmd())) {
    DB = buildSample();
    lsSet(LS_DEMO, DB);
  }
  if (DEVICE.unlocked) { SESSION.unlocked = true; enterApp(); }
  else showLock();
}
boot();

})();
</script>
